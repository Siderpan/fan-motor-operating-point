<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="由風扇目標靜壓與風量換算馬達需求轉速與轉矩，並檢查驅動電壓、電流、Ke 可行範圍與系統效率。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7.5' fill='%232453c4'/%3E%3Cpath d='M5.5 6.5V26.5H26.5' fill='none' stroke='%23a9bff2' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M7 24.5Q18 24.5 25 9.5' fill='none' stroke='%23a9bff2' stroke-width='1.6' stroke-linecap='round' stroke-dasharray='2.2 2.2'/%3E%3Cpath d='M8 9C15 9.2 20.5 13.5 24.5 24.5' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='20.75' cy='16.72' r='3' fill='%23ff8a3d' stroke='%23fff' stroke-width='1.6'/%3E%3C/svg%3E">
<title>風扇馬達操作點</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: instrument panel — inputs column (fan RD → motor → speed scaling) beside a results column */
:root{
  --bg:#edf1f7; --panel:#ffffff; --fg:#121c2e; --muted:#4f5d73; --line:#d3dae6; --soft:#f1f4f9;
  --accent:#2453c4; --accent-soft:#e3eafb; --op:#d0541a; --op-soft:#fdebe1;
  --ok:#1f7a4a; --ok-soft:#e0f3e8; --bad:#c0352b; --bad-soft:#fbe5e3; --warn:#946200; --warn-soft:#fbf0d4;
  --ref:#8e9ab0; --sys:#8a43b8; --shadow:rgba(18,28,46,.14); --grid:#e6ebf3; --line2:#b9c4d4; --scroll:#cdd5e1; --scroll-h:#aab6c7; color-scheme:light;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-disp:"Barlow Semi Condensed","Noto Sans TC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --uw:88px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --panel:#162027; --fg:#e3eaee; --muted:#93a4ae; --line:#2a3943; --soft:#1d2a32;
  --accent:#4fb3d1; --accent-soft:#163541; --op:#f0a04a; --op-soft:#3a2914;
  --ok:#6cc483; --ok-soft:#173222; --bad:#f08a80; --bad-soft:#3d1c19; --warn:#e2bd55; --warn-soft:#352c12;
  --ref:#6d7f89; --sys:#b691dd; --shadow:rgba(0,0,0,.5); --grid:#223039; --line2:#3d4f5b; --scroll:#2f3e48; --scroll-h:#465966; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --panel:#162027; --fg:#e3eaee; --muted:#93a4ae; --line:#2a3943; --soft:#1d2a32;
  --accent:#4fb3d1; --accent-soft:#163541; --op:#f0a04a; --op-soft:#3a2914;
  --ok:#6cc483; --ok-soft:#173222; --bad:#f08a80; --bad-soft:#3d1c19; --warn:#e2bd55; --warn-soft:#352c12;
  --ref:#6d7f89; --sys:#b691dd; --shadow:rgba(0,0,0,.5); --grid:#223039; --line2:#3d4f5b; --scroll:#2f3e48; --scroll-h:#465966; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-disp);font-weight:600;font-size:28px;letter-spacing:.01em;margin:0}
.theme{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:5px 12px 5px 9px;font:inherit;font-size:13px;cursor:pointer}
.theme:hover{border-color:var(--accent)}
.theme svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.theme:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;align-items:center;gap:8px}
.step{font-family:var(--f-mono);font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 7px}
h2{font-size:16px;font-weight:500;margin:0}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
@media (max-width:440px){.fields{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.full{grid-column:1/-1}
.lab{display:flex;align-items:center;gap:5px;min-height:18px}
label{font-size:12px;color:var(--muted)}
.in{display:flex;border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow:hidden;height:34px}
.in:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.in input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font-family:var(--f-mono);font-size:14px;padding:6px 8px;outline:none}
.in .u,select.unit{flex:0 0 var(--uw);width:var(--uw);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.in .u{display:flex;align-items:center;padding:0 8px;border-left:1px solid var(--line)}
select.unit{border:0;border-left:1px solid var(--line);background:transparent;padding:0 6px;outline:none;cursor:pointer;height:100%}
select.unit.solo{border:1px solid var(--line);border-radius:5px;height:26px;background:var(--bg)}
select.unit.pre{flex:0 0 74px;width:74px;border-left:0;border-right:1px solid var(--line);color:var(--fg)}
select.wide{flex:1;width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;font-size:13px;height:34px;padding:0 8px}
select.unit:focus-visible,select.wide:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:1}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:6px 8px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.seg button:focus-visible,.btn:focus-visible,.info:focus-visible,.x:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.segrow{display:flex;align-items:center;gap:8px}
.err{color:var(--bad);font-size:12px;margin:0}
.info{flex:0 0 auto;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  font-family:var(--f-mono);font-size:11px;line-height:15px;padding:0;text-align:center;cursor:pointer}
.info:hover,.info[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.pop{position:absolute;z-index:30;max-width:min(340px,calc(100vw - 32px));background:var(--panel);color:var(--fg);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.6;box-shadow:0 8px 24px var(--shadow)}
.pop code,.gl code{font-family:var(--f-mono);font-size:12px;background:var(--soft);border-radius:3px;padding:0 3px}
.pop b{font-weight:500}
.pop .t{font-weight:500;margin-bottom:2px}
/* curve table */
.ctab{border:1px solid var(--line);border-radius:6px;overflow:auto;max-height:340px}
.ctab table{border-collapse:collapse;width:100%}
.ctab th{position:sticky;top:0;background:var(--soft);font-size:12px;font-weight:500;color:var(--muted);padding:6px;border-bottom:1px solid var(--line);text-align:left;z-index:1}
.ctab th .hc{display:flex;align-items:center;gap:6px}
.ctab td{padding:0;border-bottom:1px solid var(--soft)}
.ctab td.i{width:30px;text-align:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ctab input{width:100%;min-width:64px;border:0;background:transparent;color:var(--fg);font-family:var(--f-mono);font-size:13px;padding:6px 8px;outline:none}
.ctab input:focus{background:var(--accent-soft)}
.ctab td.xx{width:30px;text-align:center}
.x{width:22px;height:22px;border:0;border-radius:4px;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);min-width:0;display:flex;flex-direction:column;gap:4px}
.kpi .k{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);min-height:18px}
.vrow{display:flex;align-items:baseline;gap:5px;min-width:0}
.vrow .v{min-width:0}
.usuf,.uin{font-family:var(--f-mono);font-size:14px;color:var(--muted);flex:0 0 auto}
.uin{appearance:none;-webkit-appearance:none;border:0;border-bottom:1px dashed var(--line2);border-radius:0;background-color:transparent;padding:0 13px 1px 1px;cursor:pointer;outline:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:right 5px center,right 1px center;background-size:4px 4px;background-repeat:no-repeat}
.uin:hover{color:var(--accent);border-bottom-color:var(--accent)}
.uin:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.uin option{color:var(--fg);background:var(--panel)}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.hl{border-color:var(--op);background:var(--op-soft)}
.verdict{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:12px 14px;border-radius:8px;border:1px solid}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.verdict.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.verdict b{font-weight:500;font-size:15px}
.verdict span{color:var(--fg);font-size:13px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:6px 8px;border-bottom:1px solid var(--soft);text-align:left;vertical-align:top}
th{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
td.n{font-family:var(--f-mono);text-align:right;white-space:nowrap}
td.d{color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.tw{overflow-x:auto}
.charts{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.ax{stroke:var(--muted);stroke-width:1}.gridl{stroke:var(--grid);stroke-width:1}
.tick{fill:var(--muted);font-family:var(--f-mono);font-size:12.5px}
.alab{fill:var(--fg);font-family:var(--f-body);font-size:13.5px;font-weight:500}
.mlab{font-family:var(--f-mono);font-size:12.5px;font-weight:500;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.legend{font-size:13px}
details.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
details.card>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.card[open]>summary::after{transform:rotate(-135deg)}
details.card>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:10px}
details.card .body{padding:0 16px 14px}
.gl{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:0;font-size:13px}
.gl dt,.gl dd{margin:0;padding:7px 0;border-bottom:1px solid var(--soft)}
.gl dt{font-weight:500;padding-right:12px}
.gl dd{color:var(--fg)}
.gl .grp{grid-column:1/-1;font-size:12px;color:var(--accent);padding:12px 0 4px;border-bottom:1px solid var(--line)}
@media (max-width:520px){.gl{grid-template-columns:minmax(0,1fr)}.gl dt{border-bottom:0;padding-bottom:0}}
.notes{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.notes li{font-size:13px;padding:7px 10px;border-radius:6px;background:var(--soft)}
.notes li.w{background:var(--warn-soft)}
pre.spec{margin:0;white-space:pre-wrap;font-family:var(--f-mono);font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:320px;overflow:auto}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--panel);font:inherit;font-size:13px;border-radius:6px;padding:5px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-size:12px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.chk input{appearance:none;-webkit-appearance:none;flex:0 0 16px;width:16px;height:16px;margin:0;border:1.5px solid var(--line2);border-radius:4px;background:var(--panel);display:grid;place-content:center;cursor:pointer;transition:background-color .15s,border-color .15s}
.chk input:hover{border-color:var(--accent)}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{content:"";width:8px;height:4px;border-left:2px solid var(--panel);border-bottom:2px solid var(--panel);transform:translateY(-1px) rotate(-45deg)}
.chk input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tw,.ctab,pre.spec{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
.tw::-webkit-scrollbar,.ctab::-webkit-scrollbar,pre.spec::-webkit-scrollbar{width:8px;height:8px}
.tw::-webkit-scrollbar-track,.ctab::-webkit-scrollbar-track,pre.spec::-webkit-scrollbar-track{background:transparent}
.tw::-webkit-scrollbar-thumb,.ctab::-webkit-scrollbar-thumb,pre.spec::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px}
.tw::-webkit-scrollbar-thumb:hover,.ctab::-webkit-scrollbar-thumb:hover,pre.spec::-webkit-scrollbar-thumb:hover{background:var(--scroll-h)}
.tw::-webkit-scrollbar-button,.ctab::-webkit-scrollbar-button,pre.spec::-webkit-scrollbar-button{display:none}
.f.off .in{opacity:.5}
table.scale td{font-family:var(--f-mono);white-space:nowrap}
table.scale th.r,table.scale td.r{text-align:right}
table.scale td small{color:var(--muted);font-size:11px;margin-left:3px}
table.scale tr.base td{color:var(--muted)}
table.scale tr.rev td{background:var(--op-soft)}
.st{width:100%;table-layout:fixed;border-collapse:collapse}
.st th{font-size:11.5px;font-weight:500;color:var(--muted);text-align:right;padding:4px 4px 6px;line-height:1.3;white-space:normal;border-bottom:1px solid var(--line);vertical-align:bottom}
.st th:first-child{text-align:left}
.st th small{display:block;font-weight:400;font-family:var(--f-mono);font-size:11px}
.st td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--soft);vertical-align:top;font-family:var(--f-mono);font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st td:first-child{text-align:left;font-weight:500}
.st td small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.st tr.base td{background:var(--soft)}
.st tr.rev td{background:var(--op-soft)}
.st td.m{font-weight:500}
.st td.m.ok{color:var(--ok)}.st td.m.warn{color:var(--warn)}.st td.m.bad{color:var(--bad)}
.st .empty{text-align:left;font-family:var(--f-body);color:var(--muted)}
.inq{display:flex;flex-direction:column;gap:14px}
.inq .ig{display:flex;flex-direction:column;gap:8px}
.inq .ih{font-size:13px;font-weight:500;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:4px}
.inq .ir{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:4px 12px;align-items:center}
@media (max-width:560px){.inq .ir{grid-template-columns:minmax(0,1fr)}}
.inq .il{font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.inq .req{font-size:10.5px;color:var(--op);border:1px solid var(--op);border-radius:3px;padding:0 4px;line-height:1.5}
.inq input{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;font-size:13px;padding:6px 8px;outline:none}
.inq input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.inq input::placeholder{color:var(--muted);opacity:.75}
.pill{display:inline-block;font-size:11px;border-radius:4px;padding:0 5px;margin-left:6px;font-family:var(--f-body)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.base{background:var(--soft);color:var(--muted)}.pill.rev{background:var(--op-soft);color:var(--op)}
@media (prefers-reduced-motion:reduce){details.card>summary::after{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>風扇馬達操作點</h1>
  <button class="theme" id="themeBtn" type="button" aria-label="切換明暗模式">
    <svg id="icoSun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg id="icoMoon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <span id="themeLab">明亮</span>
  </button>
</header>

<div class="grid">
<div class="col">

<section class="card">
  <div class="sec-h"><span class="step">1</span><h2>目標操作點</h2></div>
  <div class="fields">
    <div data-f="Pt"></div><div data-f="Qt"></div>
    <div data-f="rho"></div><div data-f="Tfric"></div>
  </div>
</section>

<section class="card">
  <div class="sec-h"><span class="step">2</span><h2>由 P、Q 求 N、T</h2></div>
  <div class="segrow">
    <div class="seg" role="group" aria-label="計算方式">
      <button type="button" id="mA" aria-pressed="true">參考 PQ 曲線</button>
      <button type="button" id="mB" aria-pressed="false">效率估算</button>
    </div>
    <button class="info" type="button" data-i="mode" aria-label="計算方式說明">i</button>
  </div>
  <div id="modeA" class="fields">
    <div data-f="N0"></div><div data-f="etaRef"></div>
    <div class="f full">
      <div class="lab"><label>參考曲線</label><button class="info" type="button" data-i="curve" aria-label="參考曲線說明">i</button></div>
      <div class="ctab"><table>
        <thead><tr><th>#</th>
          <th><span class="hc">Q<select class="unit solo" id="cQu" aria-label="曲線風量單位"></select></span></th>
          <th><span class="hc">P<select class="unit solo" id="cPu" aria-label="曲線靜壓單位"></select></span></th>
          <th><span class="hc">T<select class="unit solo" id="cTu" aria-label="曲線轉矩單位"></select></span></th>
          <th></th></tr></thead>

{let t='light';try{t=localStorage.getItem('fmTheme2')||'light';}catch(e){}document.documentElement.setAttribute('data-theme',t);}

const toB=(k,v,u)=>k==='Tc'?(u==='K'?v-273.15:v):v*U[k][u][1];

/* ---------- fields & definitions ---------- */
const F={
  Pt:{k:'P',lab:'目標靜壓 P',v:55,u:'Pa',d:'風扇出口與入口之間的<b>靜壓差</b>，不含動壓。即 PQ 曲線的縱軸，由風扇 RD 依系統阻抗決定。'},

};

const GLOSS=[
  ['風扇',[['靜壓 P','風扇出入口的靜壓差，不含動壓 ½ρv²。'],['系統阻抗','流道（散熱片、濾網、機殼）造成的壓損，近似 <code>P = kQ²</code>。'],

/* ---------- math ---------- */
function interp(rows,q,key){if(q<=rows[0].q)return rows[0][key];
  for(let i=1;i<rows.length;i++){if(q<=rows[i].q){const a=rows[i-1],b=rows[i],f=(q-a.q)/(b.q-a.q||1);return a[key]+f*(b[key]-a[key]);}}
  return rows[rows.length-1][key];}
function bisect(f,a,b,n=80){let fa=f(a);for(let i=0;i<n;i++){const m=(a+b)/2,fm=f(m);if((fm>0)===(fa>0)){a=m;fa=fm;}else b=m;}return(a+b)/2;}
function parseCurve(){const rows=[];
  for(let i=0;i<st.cRows.length;i++){const r=st.cRows[i];if(r.every(x=>(x??'')===''))continue;
    const q=parseFloat(r[0]),p=parseFloat(r[1]),t=r[2]===''||r[2]==null?NaN:parseFloat(r[2]);
    if(!isFinite(q)||!isFinite(p))return{err:'第 '+(i+1)+' 列的 Q 或 P 不是有效數字。'};
    if(r[2]!==''&&r[2]!=null&&!isFinite(t))return{err:'第 '+(i+1)+' 列的 T 不是有效數字。'};
    rows.push({q:toB('Q',q,st.cQu),p:toB('P',p,st.cPu),t:isFinite(t)?toB('T',t,st.cTu):NaN});}
  if(rows.length<3)return{err:'參考曲線至少需要 3 個點。'};
  rows.sort((a,b)=>a.q-b.q);return{rows,hasT:rows.every(r=>isFinite(r.t))};}

function Lval(){switch(st.Lsrc){case'll':return get('Lll')/2;case'ph':return get('Lph');case'tau':return get('tau')*get('Rph');default:return 0;}}
function motorParams(){return{sq:st.drive==='sq',Vdc:get('Vdc'),Vdrv:get('Vdrv'),Ke:get('Ke'),KeT:get('KeT'),Rph:get('Rph'),RT:get('RT'),
  Tw:get('Tw'),Tm:get('Tm'),aBr:get('aBr'),poles:get('poles'),L:Lval(),mi:get('mi'),Tf:get('Tfric')||0};}
function motorModel(s,Tfan_at,Nt){
  const sq=s.sq,Rh=s.Rph*(1+0.00393*(s.Tw-s.RT)),KeEff=s.Ke*(1+s.aBr/100*(s.Tm-s.KeT)),L=isFinite(s.L)?s.L:0;
  const toSI=k=>k/(1000*TAU/60),Kt=k=>sq?toSI(k):Math.sqrt(3)/2*toSI(k);
  const Vav=sq?(s.Vdc-s.Vdrv):(s.Vdc-s.Vdrv)/Math.sqrt(3)*s.mi;
  function vreq(n,ke){const T=Tfan_at(n)+s.Tf,I=T/Kt(ke),E=ke*n/1000;
    if(sq)return{V:E+2*I*Rh,I,E,T};const we=n*TAU/60*s.poles/2,Eph=E/Math.sqrt(3);return{V:Math.hypot(Eph+I*Rh,we*L*I),I,E:Eph,T};}
  const op=vreq(Nt,KeEff),Nmax=bisect(n=>vreq(n,KeEff).V-Vav,1,Nt*20);
  const keOpt=bisect(k=>{const h=k*1e-4;return vreq(Nt,k+h).V-vreq(Nt,k-h).V;},1e-4,KeEff*50+50);
  let keLo=NaN,keHi=NaN;if(vreq(Nt,keOpt).V<Vav){keLo=bisect(k=>vreq(Nt,k).V-Vav,1e-6,keOpt);keHi=bisect(k=>Vav-vreq(Nt,k).V,keOpt,keOpt*200+100);}
  const w=Nt*TAU/60,we=w*s.poles/2,Pm=op.T*w,Pcu=(sq?2:1.5)*op.I*op.I*Rh,Pin=(Pm+Pcu)/(1-s.Vdrv/s.Vdc);
  const tc=Math.PI/3/we,trise=(sq&&L>0&&Vav>op.E)?2*L*op.I/(Vav-op.E):NaN;
  const tn=n=>{const E=KeEff*n/1000;return Math.max(0,sq?Kt(KeEff)*(Vav-E)/(2*Rh):Kt(KeEff)*(Vav-E/Math.sqrt(3))/Rh);};
  const n0=sq?Vav/KeEff*1000:Vav*Math.sqrt(3)/KeEff*1000;
  return{sq,Rh,KeEff,Vav,op,Nmax,keLo,keHi,Pm,Pcu,Pin,Idc:Pin/s.Vdc,tn,n0,margin:Vav-op.V,Kt:Kt(KeEff),L,we,tc,trise,xr:we*L/Rh};}
const motorReady=s=>[s.Vdc,s.Vdrv,s.Ke,s.Rph,s.Tw,s.RT,s.Tm,s.KeT,s.aBr,s.poles].every(isFinite)&&s.Vdc>s.Vdrv&&s.Ke>0&&s.Rph>0&&s.poles>0&&(s.sq||s.mi>0);

function ticks(max,n=5){if(!(max>0))max=1;const raw=max/n,p=Math.pow(10,Math.floor(Math.log10(raw)));const m=[1,2,2.5,5,10].find(x=>x*p>=raw);const s=m*p,t=[];
  for(let v=0;v<=max*1.0001;v+=s)t.push(+v.toPrecision(10));return{t,top:t[t.length-1]<max?t[t.length-1]+s:t[t.length-1]};}
const chartOpts={};
function chart(svg,o){chartOpts[svg.id]=o;
  const W=Math.max(300,Math.round(svg.getBoundingClientRect().width)||640),H=Math.round(Math.min(380,Math.max(260,W*0.5)));

  const xt=ticks(o.xmax,nt),yt=ticks(o.ymax,5),X=v=>ml+v/xt.top*pw,Y=v=>mt+ph-v/yt.top*ph;let g='';

  xt.t.forEach(v=>{g+=`<line class="gridl" x1="${X(v)}" x2="${X(v)}" y1="${mt}" y2="${mt+ph}"/><text class="tick" x="${X(v)}" y="${mt+ph+20}" text-anchor="middle">${fmt(v,3)}</text>`;});
  g+=`<line class="ax" x1="${ml}" x2="${ml+pw}" y1="${mt+ph}" y2="${mt+ph}"/><line class="ax" x1="${ml}" x2="${ml}" y1="${mt}" y2="${mt+ph}"/>`;
  g+=`<text class="alab" x="${ml+pw/2}" y="${H-10}" text-anchor="middle">${o.xl}</text><text class="alab" x="${ml}" y="${mt-14}" text-anchor="middle">${o.yl}</text>`;
  g+=`<defs><clipPath id="c-${svg.id}"><rect x="${ml}" y="${mt}" width="${pw}" height="${ph}"/></clipPath></defs><g clip-path="url(#c-${svg.id})">`;
  o.series.forEach(s=>{const d=s.pts.filter(p=>isFinite(p[0])&&isFinite(p[1])).map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${(s.w||2)+0.4}" stroke-linejoin="round" ${s.dash?`stroke-dasharray="${s.dash}"`:''}/>`;});
  g+='</g>';
  (o.marks||[]).forEach(m=>{if(!isFinite(m.x)||!isFinite(m.y))return;const cx=X(m.x),cy=Y(m.y);
    if(m.guide)g+=`<line x1="${cx}" x2="${cx}" y1="${cy}" y2="${mt+ph}" stroke="${m.c}" stroke-dasharray="4 4" stroke-width="1"/><line x1="${ml}" x2="${cx}" y1="${cy}" y2="${cy}" stroke="${m.c}" stroke-dasharray="4 4" stroke-width="1"/>`;
    g+=`<circle cx="${cx}" cy="${cy}" r="${(m.r||5)+0.5}" fill="${m.fill||m.c}" stroke="${m.c}" stroke-width="2"/>`;
    const right=cx<ml+pw*0.6,ty=Math.max(mt+14,cy-11);g+=`<text class="mlab" x="${right?cx+11:cx-11}" y="${ty}" text-anchor="${right?'start':'end'}" style="fill:${m.c}">${m.label}</text>`;});
  svg.innerHTML=g;}

function update(){save();updateScale();
  const notes=[],det=[];
  const Pt=get('Pt'),Qt=get('Qt'),dens=(get('rho')||1.2)/1.2;
  const pu=st.vals.Pt.u,qu=st.vals.Qt.u,dN=st.dispN,dT=st.dispT;
  const sP=v=>fmt(fromB('P',v,pu),4)+' '+ul('P',pu),sQ=v=>fmt(fromB('Q',v,qu),4)+' '+ul('Q',qu);
  const sN=v=>fmt(fromB('N',v,dN),5)+' '+ul('N',dN),sT=v=>fmt(fromB('T',v,dT),4)+' '+ul('T',dT);
  let N,Tfan,Q1,rows=null;$('curveErr').hidden=true;
  if(!(Pt>0&&Qt>0))return render(null,'請輸入大於 0 的目標 P 與 Q。');
  if(st.mode==='A'){
    const c=parseCurve();
    if(c.err){$('curveErr').textContent=c.err;$('curveErr').hidden=false;return render(null,'參考曲線資料有誤。');}
    const N0=get('N0');if(!(N0>0))return render(null,'請輸入參考轉速 N₀。');
    rows=c.rows.map(r=>({...r,p:r.p*dens}));
    const k=Pt/(Qt*Qt),qmax=rows[rows.length-1].q,g=q=>interp(rows,q,'p')-k*q*q;
    if(g(rows[0].q)<=0)return render(null,'系統阻抗曲線高於參考曲線起點，找不到交點。');
    Q1=g(qmax)>0?qmax:bisect(g,rows[0].q,qmax);const P1=interp(rows,Q1,'p');
    N=N0*Qt/Q1;
    let T1;if(c.hasT)T1=interp(rows,Q1,'t')*dens;
    else{T1=P1*Q1/((get('etaRef')/100)*N0*TAU/60);notes.push(['','參考曲線無 T 欄，轉矩由靜壓效率反推。']);}
    Tfan=T1*Math.pow(N/N0,2);const pos=Q1/qmax;
    det.push(['N₀ 曲線相似點',sQ(Q1)+' / '+sP(P1),'P = kQ² 交點'],['N / N₀',fmt(N/N0,5),'Q∝N, P∝N², T∝N²'],['操作點位置',(pos*100).toFixed(0)+' % Qmax','']);
    if(pos<0.3)notes.push(['w','操作點在最大風量的 '+(pos*100).toFixed(0)+'%，靠近高靜壓區，軸流扇可能失速。']);
    else if(pos>0.85)notes.push(['w','操作點在最大風量的 '+(pos*100).toFixed(0)+'%，靠近自由送風端，靜壓效率偏低。']);
    if(N/N0>1.4||N/N0<0.6)notes.push(['w','換算轉速與參考轉速相差 '+Math.abs(N/N0*100-100).toFixed(0)+'%，建議在目標轉速附近重新量測曲線。']);
  }else{
    const Nb=get('Nb'),eB=get('etaB');if(!(Nb>0&&eB>0))return render(null,'請輸入預估轉速與靜壓效率。');
    N=Nb;Tfan=Pt*Qt/((eB/100)*N*TAU/60);notes.push(['','效率估算模式，轉矩準確度取決於效率假設。']);
  }
  const s=motorParams();if(!motorReady(s))return render(null,'請完整輸入馬達參數（Vdc 需大於壓降）。');
  const w=N*TAU/60,Pair=Pt*Qt,Pshaft=Tfan*w,eta=Pair/Pshaft,m=motorModel(s,n=>Tfan*Math.pow(n/N,2),N);
  det.unshift(['空氣功率',fW(Pair),'P·Q']);
  det.push(['軸功率',fW(Pshaft),'T·ω'],['靜壓效率',fmt(eta*100,3)+' %','P·Q ÷ T·ω'],['總負載轉矩',sT(m.op.T),'風扇 + 摩擦'],
    ['熱態相電阻',fmt(m.Rh,4)+' Ω','α = 0.00393 /K'],['修正後 Ke',fmt(m.KeEff,4)+' V/krpm','磁鐵溫度修正'],
    ['Kt',fmt(m.Kt*1e3,4)+' mN·m/A',m.sq?'= Ke (SI)':'= (√3/2)·Ke'],
    ['相電感 L_ph',st.Lsrc==='none'?'忽略':fmt(m.L*1e3,4)+' mH',{ll:'L_LL ÷ 2',ph:'直接輸入',tau:'τe × R_ph',none:''}[st.Lsrc]],
    ['ωe·L / R',st.Lsrc==='none'?'–':fmt(m.xr,3),'< 0.3 可忽略電感'],
    [m.sq?'E_LL':'E_ph,pk',fmt(m.op.E,4)+' V','Ke·N'],[m.sq?'所需電壓':'所需相電壓峰值',fmt(m.op.V,4)+' V',m.sq?'E + 2·I·R':'√[(E+IR)²+(ωLI)²]'],
    [m.sq?'可用電壓':'可用相電壓峰值',fmt(m.Vav,4)+' V',m.sq?'Vdc − 壓降':'(Vdc − 壓降)/√3·m']);
  if(m.sq)det.push(['換相區間',fmt(m.tc*1e6,4)+' µs','(π/3) ÷ ωe'],['電流建立時間',isFinite(m.trise)?fmt(m.trise*1e6,4)+' µs':'–','2·L·I ÷ (V − E)']);
  det.push(['銅損',fW(m.Pcu),m.sq?'2·I²·R':'1.5·I²·R'],['輸入功率',fW(m.Pin),'不含鐵損'],['直流輸入電流',fmt(fromB('I',m.Idc,st.dispI),4)+' '+ul('I',st.dispI),'P_in ÷ Vdc'],
    ['全壓自然轉速',sN(m.Nmax),'T–N 與負載交點'],['可行 Ke 範圍',isFinite(m.keLo)?fmt(m.keLo,3)+' – '+fmt(m.keHi,3)+' V/krpm':'無','目標轉速下']);
  if(m.sq&&isFinite(m.trise)){const r=m.trise/m.tc;
    if(r>0.3)notes.push(['w','電流建立時間佔換相區間 '+(r*100).toFixed(0)+'%，換相時轉矩會下降，實際轉速可能低於計算值。']);}
  if(m.sq&&st.Lsrc==='none')notes.push(['','已忽略電感，未做換相電流建立檢查。']);
  if(!m.sq&&m.xr>0.3)notes.push(['w','ωe·L / R = '+fmt(m.xr,3)+'，電感壓降不可忽略。']);
  if(s.Tm>s.KeT)notes.push(['','磁鐵溫度高於 Ke 量測溫度，Ke 已下修；冷態條件請另行確認。']);
  if(isFinite(m.keLo)&&m.KeEff<m.keLo*1.05&&m.margin>=0)notes.push(['w','Ke 接近下限，電流與銅損偏大。']);
  if(isFinite(m.keHi)&&m.KeEff>m.keHi*0.95&&m.margin>=0)notes.push(['w','Ke 接近上限，建議預留 3%–5% 公差。']);
  render({N,Tfan,Pair,Pshaft,eta,m,rows,Q1,Pt,Qt,det,notes,s,sN,sT,sP,sQ,pu,qu,dN,dT});
}

function render(r,msg){const v=$('verdict');
  if(!r){['kN','kT','kI','kE'].forEach(k=>$(k).textContent='–');v.className='verdict warn';$('vTitle').textContent='無法計算';$('vText').textContent=msg;
    $('detail').innerHTML='';$('notes').innerHTML='';$('spec').textContent='';$('pqChart').innerHTML='';$('tnChart').innerHTML='';return;}
  const{N,Tfan,m,s,pu,qu,dN,dT}=r;
  $('kN').textContent=fmt(fromB('N',N,dN),5);$('kT').textContent=fmt(fromB('T',Tfan,dT),4);
  $('kI').textContent=fmt(fromB('I',m.op.I,st.dispI),4);$('kIlab').textContent=m.sq?'相電流':'相電流峰值';$('kE').textContent=fmt(r.Pair/m.Pin*100,3);
  const pct=m.margin/m.Vav*100;
  if(m.margin<0){v.className='verdict bad';$('vTitle').textContent='電壓不足';
    $('vText').textContent='需要 '+fmt(m.op.V,4)+' V，可用 '+fmt(m.Vav,4)+' V；全壓最高 '+r.sN(m.Nmax)+'。'+(isFinite(m.keLo)?'可行 Ke：'+fmt(m.keLo,3)+'–'+fmt(m.keHi,3)+' V/krpm。':'目前 R 下無可行 Ke。');}
  else if(pct<5){v.className='verdict warn';$('vTitle').textContent='裕度不足 5%';$('vText').textContent='剩 '+fmt(m.margin,3)+' V（'+pct.toFixed(1)+'%），全壓自然轉速 '+r.sN(m.Nmax)+'。';}
  else{v.className='verdict ok';$('vTitle').textContent='電壓足夠';$('vText').textContent='剩 '+fmt(m.margin,3)+' V（'+pct.toFixed(1)+'%），全壓自然轉速 '+r.sN(m.Nmax)+'。';}
  $('detail').innerHTML=r.det.map(d=>`<tr><td>${d[0]}</td><td class="n">${d[1]}</td><td class="d">${d[2]}</td></tr>`).join('');
  $('notes').innerHTML=r.notes.length?r.notes.map(n=>`<li class="${n[0]}">${n[1]}</li>`).join(''):'<li>無。</li>';
  const cP=x=>fromB('P',x,pu),cQ=x=>fromB('Q',x,qu),series=[];
  let xmax=cQ(r.Qt)*1.6,ymax=cP(r.Pt)*1.6;
  if(r.rows){const sc=N/get('N0'),ref=r.rows.map(x=>[cQ(x.q),cP(x.p)]),scl=r.rows.map(x=>[cQ(x.q*sc),cP(x.p*sc*sc)]);
    xmax=Math.max(...ref.map(p=>p[0]),...scl.map(p=>p[0]))*1.05;ymax=Math.max(...ref.map(p=>p[1]),...scl.map(p=>p[1]))*1.08;
    series.push({pts:ref,c:'var(--ref)',dash:'6 4',w:1.6},{pts:scl,c:'var(--accent)'});}
  const k=cP(r.Pt)/Math.pow(cQ(r.Qt),2),sys=[];for(let i=0;i<=60;i++){const q=xmax*i/60;sys.push([q,k*q*q]);}
  series.push({pts:sys,c:'var(--sys)',dash:'2 4',w:1.6});
  const marks=[{x:cQ(r.Qt),y:cP(r.Pt),c:'var(--op)',label:fmt(cQ(r.Qt),3)+', '+fmt(cP(r.Pt),3),guide:true,r:6}];
  if(r.rows)marks.push({x:cQ(r.Q1),y:cP(interp(r.rows,r.Q1,'p')),c:'var(--ref)',fill:'var(--panel)',label:'N₀ 相似點',r:4});
  chart($('pqChart'),{xmax,ymax,xl:'Q ('+ul('Q',qu)+')',yl:'P ('+ul('P',pu)+')',series,marks});
  const cN=x=>fromB('N',x,dN),cT=x=>fromB('T',x,dT),nTop=Math.max(m.n0,N*1.3)*1.02,tn=[],ld=[];
  for(let i=0;i<=80;i++){const n=nTop*i/80;tn.push([cN(n),cT(m.tn(n))]);ld.push([cN(n),cT(Tfan*Math.pow(n/N,2)+s.Tf)]);}
  const tTop=cT(Math.max(m.op.T*2.2,Math.min(m.tn(0),m.op.T*6)));
  chart($('tnChart'),{xmax:cN(nTop),ymax:tTop,xl:'N ('+ul('N',dN)+')',yl:'T ('+ul('T',dT)+')',series:[{pts:tn,c:'var(--accent)'},{pts:ld,c:'var(--op)'}],
    marks:[{x:cN(N),y:cT(m.op.T),c:'var(--op)',label:'目標 '+fmt(cN(N),5),guide:true,r:6},{x:cN(m.Nmax),y:cT(m.tn(m.Nmax)),c:'var(--accent)',fill:'var(--panel)',label:'全壓 '+fmt(cN(m.Nmax),5),r:5}]});
  const L=['【風扇馬達操作點】',
    '目標：P = '+r.sP(r.Pt)+'，Q = '+r.sQ(r.Qt)+'，ρ = '+fmt(get('rho'),4)+' kg/m³',
    st.mode==='A'?'依據：參考曲線 @ '+fmt(get('N0'),5)+' rpm，風扇定律':'依據：預估轉速，靜壓效率 '+fmt(get('etaB'),3)+' %',
    '需求轉速 N = '+r.sN(N),'風扇轉矩 T = '+r.sT(Tfan)+'；含摩擦 '+r.sT(m.op.T),
    '空氣功率 '+fW(r.Pair)+'，軸功率 '+fW(r.Pshaft)+'，靜壓效率 '+fmt(r.eta*100,3)+' %','',
    '馬達（'+(m.sq?'方波 120°':'正弦 SVPWM')+'，Vdc = '+fmt(s.Vdc,4)+' V）',
    'Ke = '+fmt(m.KeEff,4)+' V/krpm，R_ph(熱) = '+fmt(m.Rh,4)+' Ω'+(st.Lsrc==='none'?'':'，L_ph = '+fmt(m.L*1e3,4)+' mH'),
    '相電流 '+fmt(fromB('I',m.op.I,st.dispI),4)+' '+ul('I',st.dispI)+(m.sq?'':'（峰值）')+'，輸入功率 '+fW(m.Pin),
    '電壓裕度 '+fmt(m.margin,3)+' V（'+pct.toFixed(1)+'%），全壓自然轉速 '+r.sN(m.Nmax),
    '系統效率 ≈ '+fmt(r.Pair/m.Pin*100,3)+' %（不含鐵損）'];
  $('spec').textContent=L.join('\n');}

/* ---------- speed scaling ---------- */
let scaleText='';
function updateScale(){
  const nu=st.sListU,qu=st.vals.sQ0.u,pu=st.vals.sP0.u,tu=st.vals.sT0.u;
  $('scaleHead').innerHTML=`<th>轉速<small>${ul('N',nu)}</small></th><th>風量 Q<small>${ul('Q',qu)}</small></th><th>靜壓 P<small>${ul('P',pu)}</small></th><th>轉矩 T<small>${ul('T',tu)}</small></th><th>軸功率<small>mW</small></th><th>裕度<small>V</small></th>`;
  $('revF').classList.toggle('off',!st.sRevOn);
  const body=$('scaleBody'),err=$('sListErr');err.hidden=true;
  const N0=get('sN0'),Q0=get('sQ0'),P0=get('sP0'),T0=get('sT0');
  if(!(N0>0&&Q0>0&&P0>0&&T0>0)){body.innerHTML='<tr><td colspan="6" class="empty">請輸入已知 N₀、Q₀、P₀、T₀。</td></tr>';scaleText='';return;}
  const list=[];
  for(const t of (st.sList||'').split(/[\s,;，、]+/).filter(Boolean)){const v=parseFloat(t);if(!(v>0)){err.textContent='「'+t+'」不是有效的轉速。';err.hidden=false;continue;}list.push({n:toB('N',v,nu),kind:''});}
  if(st.sRevOn&&st.sRev.v>0){const tv=toB(revKind(),st.sRev.v,st.sRev.u),r=tv/({q:Q0,p:P0,t:T0}[st.sRevK]);list.push({n:st.sRevK==='q'?N0*r:N0*Math.sqrt(r),kind:'rev'});}
  list.sort((a,b)=>a.n-b.n);list.unshift({n:N0,kind:'base'});
  const s=motorParams(),ok=motorReady(s);
  const lines=['N['+ul('N',nu)+']\tN/N0\tQ['+ul('Q',qu)+']\tP['+ul('P',pu)+']\tT['+ul('T',tu)+']\t軸功率[W]\t電壓裕度[V]'];
  body.innerHTML=list.map(o=>{const r=o.n/N0,Q=Q0*r,P=P0*r*r,T=T0*r*r,W=T*o.n*TAU/60;
    let vm='–',vt='',vc='';if(ok){const m=motorModel(s,n=>T0*Math.pow(n/N0,2),o.n),pct=m.margin/m.Vav*100;
      vc=m.margin<0?'bad':pct<5?'warn':'ok';vm=fmt(m.margin,3)+'<small>'+(vc==='bad'?'不足':vc==='warn'?'偏低':'足夠')+'</small>';vt=fmt(m.margin,3);}
    const d=x=>'<small>'+(o.kind==='base'?'&nbsp;':(x>=0?'+':'')+x.toFixed(1)+'%')+'</small>';
    const tag='<small>'+(o.kind==='base'?'已知':o.kind==='rev'?'反推':'×'+r.toFixed(4))+'</small>';
    const nv=fromB('N',o.n,nu),qv=fromB('Q',Q,qu),pv=fromB('P',P,pu),tv=fromB('T',T,tu);
    lines.push([fmt(nv,6),r.toFixed(5),fmt(qv,5),fmt(pv,5),fmt(tv,5),fmt(W,4),vt].join('\t'));
    return `<tr class="${o.kind}" title="N/N₀ = ${r.toFixed(5)}"><td>${fmt(nv,6)}${tag}</td><td>${fmt(qv,4)}${d((r-1)*100)}</td><td>${fmt(pv,4)}${d((r*r-1)*100)}</td><td>${fmt(tv,4)}${d((r*r-1)*100)}</td><td>${fmt(W*1e3,4)}${d((r*r*r-1)*100)}</td><td class="m ${vc}">${vm}</td></tr>`;}).join('');
  scaleText=lines.join('\n');}

function copyText(t,msgEl,okMsg,el){const done=ok=>{$(msgEl).textContent=ok?okMsg:'無法複製，請手動選取';setTimeout(()=>$(msgEl).textContent='',2200);};
  try{navigator.clipboard.writeText(t).then(()=>done(true),()=>{if(el)selectEl(el);done(false);});}catch(e){if(el)selectEl(el);done(false);}}
function selectEl(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}
$('copyBtn').onclick=()=>copyText($('spec').textContent,'copyMsg','已複製',$('spec'));
$('copyScale').onclick=()=>copyText(scaleText,'copyMsg2','已複製，可貼到 Excel',null);
update();
</script>
